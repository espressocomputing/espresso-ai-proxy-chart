replicaCount: 2

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: espresso/proxy
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 1000m
    memory: 2048Mi
  limits:
    cpu: 1500m
    memory: 3072Mi

# Container environment variables, expressed as a standard Kubernetes env
# list. Both literal values and valueFrom sources are supported, e.g.:
#
#   env:
#     - name: NODE_IP
#       valueFrom:
#         fieldRef:
#           fieldPath: status.hostIP
#     - name: PROXY_HOST
#       value: "proxy.example.com"
#
# User-defined entries are rendered before the chart's managed variables, so
# a value such as "http://$(NODE_IP):4318" can reference them via Kubernetes
# $(VAR) substitution.
#
# Notes:
# - PROXY_HOST is required and must be provided as a literal value.
# - API_URL and OTEL_EXPORTER_OTLP_ENDPOINT may be set here to override the
#   chart defaults; provide them as literal values only.
env:
  - name: PROXY_HOST
    value: ""

customer: ""
apiUrl: "https://api.espressocomputing.com:25831"

apiKeySecret:
  name: ""

otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.152.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  espresso:
    endpoint: "https://metrics.espressocomputing.com:443"
  customer:
    # Endpoint of the customer's own OTLP backend. Leave empty to disable
    # the customer exporter; the espresso pipeline still runs on its own.
    endpoint: ""
    protocol: grpc
    signals:
      - metrics
      - logs
    # Secret holding the value for the customer endpoint's Authorization header.
    # Leave name empty for unauthenticated endpoints.
    authSecret:
      name: ""
      key: authorization
    tls:
      insecure: false

probes:
  readiness:
    enabled: true
    path: /healthcheck
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    enabled: true
    path: /healthcheck
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

lifecycle:
  preStop:
    enabled: true
    command:
      - sh
      - -c
      - sleep 10

terminationGracePeriodSeconds: 30

podDisruptionBudget:
  enabled: true
  minAvailable: 1

service:
  type: ClusterIP
  port: 5050
  annotations: {}

ingress:
  enabled: false
  # Supported values:
  # - generic: emit only className, hosts, TLS, and user-provided annotations
  # - aws: add AWS Load Balancer Controller ALB annotations
  # - azure: add Azure Application Gateway Ingress Controller annotations
  provider: generic
  className: ""
  host: ""
  path: /
  pathType: Prefix
  annotations: {}
  # Supports either the standard ingress TLS list or this shorthand:
  # tls:
  #   secretName: proxy-tls
  #   hosts:
  #   - proxy.example.com
  # When hosts is omitted from the shorthand, ingress.host is used.
  tls: null
  # Adds a second, hostless /healthcheck rule for external health probes that
  # do not send the application Host header, such as Azure Front Door probes.
  healthcheck:
    enabled: false
    path: /healthcheck
    pathType: Prefix
  aws:
    certificateArn: ""
    scheme: internet-facing
    targetType: ip
    listenPorts: '[{"HTTPS":443}]'
    sslRedirect: "443"
    healthcheckPath: /healthcheck
    annotations: {}
  # Backward-compatible alias for the previous AWS-only values structure.
  alb: {}
  azure:
    sslRedirect: true
    healthProbePath: /healthcheck
    appgwSslCertificate: ""
    annotations: {}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}
